syntax = "proto3";

package probe.v1;

option go_package = "github.com/xjetry/probe/gen/probe/v1;probev1";

// 一次上报里的主机读数。每个读数都是 optional：缺失表示"无读数"，
// 与读数为 0 是两个不同的事实，从协议一直保持到图表。
message Metrics {
  // 启动周期标识，随计数器同一条消息到达：流量差分必须在同一条消息里
  // 同时拿到计数器与它所属的启动周期，否则重启后的首次上报会被误当增量。
  string boot_id = 1;
  optional double cpu_pct = 2;
  optional double load1 = 3;
  optional double load5 = 4;
  optional double load15 = 5;
  optional uint64 mem_total = 6;
  optional uint64 mem_used = 7;
  optional uint64 swap_total = 8;
  optional uint64 swap_used = 9;
  optional uint64 disk_total = 10;
  optional uint64 disk_used = 11;
  // 内核累计计数器，hub 侧做差分。
  optional uint64 net_rx_total = 12;
  optional uint64 net_tx_total = 13;
  // agent 按本地采样间隔测得的 bytes/s；用于实时视图和历史采样峰值。
  optional uint64 net_rx_bps = 14;
  optional uint64 net_tx_bps = 15;
  optional uint32 tcp_conns = 16;
  optional uint32 udp_conns = 17;
  optional uint32 procs = 18;
  optional uint64 uptime_s = 19;
}

// 主机静态信息。进程启动后的首次上报携带；此后仅在 hub 要求时携带。
message Facts {
  string hostname = 1;
  string os = 2;
  string kernel = 3;
  string arch = 4;
  string virtualization = 5;
  string cpu_model = 6;
  uint32 cpu_cores = 7;
  string agent_version = 8;
  // 两种 ICMP socket 是否至少一种可用。
  bool icmp_available = 9;
}

message ProbeResult {
  uint64 task_id = 1;
  // 测量完成至发送的时长，agent 单调钟；hub 用它反推测量时刻。
  uint32 age_ms = 2;
  oneof outcome {
    uint32 rtt_us = 3;
    // 计入丢包。
    Timeout timeout = 4;
    // 无权限、解析失败等；不计入丢包。
    ProbeError error = 5;
  }
}

message Timeout {}

message ProbeError {
  string message = 1;
}

enum ProbeKind {
  PROBE_KIND_UNSPECIFIED = 0;
  PROBE_KIND_ICMP = 1;
  PROBE_KIND_TCP = 2;
}

message ProbeTask {
  uint64 id = 1;
  ProbeKind kind = 2;
  string target = 3;
  uint32 interval_s = 4;
  uint32 timeout_ms = 5;
}

message ProbeTasks {
  uint64 version = 1;
  repeated ProbeTask tasks = 2;
}

message Traffic {
  // 自节点首次上报以来 hub 累计的字节数。校正只改周期用量，总量随同一差值变动。
  uint64 total_rx = 1;
  uint64 total_tx = 2;
  // 当前周期内的字节数。
  uint64 period_rx = 3;
  uint64 period_tx = 4;
  // 当前周期起点与下次重置时刻，Unix 秒。
  int64 period_start = 5;
  int64 next_reset_at = 6;
  // 周期重置日 1–28。
  uint32 reset_day = 7;
}

// 节点的计费周期（§9.4）。管理与公开两端共用，所以与 Billing 一起定义在这里：public.proto 不能 import admin.proto。
// 未指定表示没有周期（一次性付费或未填）；自动续期要求非未指定。
enum BillingCycle {
  BILLING_CYCLE_UNSPECIFIED = 0;
  // 1 个月。
  BILLING_CYCLE_MONTHLY = 1;
  // 3 个月。
  BILLING_CYCLE_QUARTERLY = 2;
  // 6 个月。
  BILLING_CYCLE_SEMIANNUAL = 3;
  // 12 个月。
  BILLING_CYCLE_YEARLY = 4;
  // 24 个月。
  BILLING_CYCLE_BIENNIAL = 5;
  // 36 个月。
  BILLING_CYCLE_TRIENNIAL = 6;
  // 60 个月。
  BILLING_CYCLE_QUINQUENNIAL = 7;
}

// 节点的计费与到期（§9.4）。价格与币种是提醒用的展示值：hub 不汇总、不换算，也不拿它们做任何计算；到期日与周期
// 驱动 days_left、自动续期与到期规则。Node 与 UpdateNodeRequest 都以它承载；公开端的 PublicBilling 由它按字段名投影生成，两者对不齐时 hub 构造公开服务就 panic。
message Billing {
  // 价格，十进制文本（如 12.50）；空表示未填。保存时须为空或匹配 ^[0-9]{1,9}(\.[0-9]{1,2})?$。
  string price = 1;
  // ISO 4217 币种代码（三个大写字母）；价格非空时必填，币种可以单独填。
  string currency = 2;
  BillingCycle billing_cycle = 3;
  // 到期日 YYYY-MM-DD；空表示没有到期日。保存时须为空或存在的日期。
  string expires_on = 4;
  // 开着时，到期日早于今天（hub 时区）即按周期推后到不早于今天。hub 启动、每个日界（零点不存在的日子取新一天的
  // 第一个时刻）、计费字段变化与保存启用的到期规则时检查。保存时要求 billing_cycle 与 expires_on 都非空。
  bool auto_renew = 5;
  // 到期日减去今天的天数，今天按 hub 的 --timezone 取日历日；负数是已过期的天数。没有到期日、或库里的到期日无法解析时缺失。只由 hub 填写：
  // 保存请求里的值忽略，与 AlertRule.created_at 同一做法。
  optional int32 days_left = 6;
}
