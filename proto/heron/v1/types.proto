syntax = "proto3";

package heron.v1;

option go_package = "github.com/xjetry/heron-probe/gen/heron/v1;heronv1";

// 一次上报里的主机读数。每个读数都是 optional：缺失表示"无读数"，
// 与读数为 0 是两个不同的事实，从协议一直保持到图表。
message Metrics {
  // 启动周期标识，随计数器同一条消息到达：流量差分必须在同一条消息里
  // 同时拿到计数器与它所属的启动周期，否则重启后的首次上报会被误当增量。
  string boot_id = 1;
  optional double cpu_pct = 2;
  optional double load1 = 3;
  optional double load5 = 4;
  optional double load15 = 5;
  optional uint64 mem_total = 6;
  optional uint64 mem_used = 7;
  optional uint64 swap_total = 8;
  optional uint64 swap_used = 9;
  optional uint64 disk_total = 10;
  optional uint64 disk_used = 11;
  // 内核累计计数器，hub 侧做差分。
  optional uint64 net_rx_total = 12;
  optional uint64 net_tx_total = 13;
  // agent 按本地采样间隔测得的 bytes/s；用于实时视图和历史采样峰值。
  optional uint64 net_rx_bps = 14;
  optional uint64 net_tx_bps = 15;
  optional uint32 tcp_conns = 16;
  optional uint32 udp_conns = 17;
  optional uint32 procs = 18;
  optional uint64 uptime_s = 19;
  // 实际计入网络合计的网卡名称集合的 SHA-256，小写十六进制；与计数同次采样。
  // 集合改变时仅重建差分基线，不把旧网卡计数当新增流量。空串表示旧 agent 未提供此能力。
  string net_counter_epoch = 20;
  // agent 本地两次采样间整盘设备读/写字节速率合计，bytes/s；与 net_rx_bps / net_tx_bps 同一差分规则：
  // 首样本、设备集合变化或任一设备计数回退时缺失，不伪造零值。
  optional uint64 disk_read_bps = 21;
  optional uint64 disk_write_bps = 22;
  // steal 与 iowait 占全部 CPU tick 的百分比，与 cpu_pct 取自同一次 /proc/stat 两次采样差分；
  // 不是 cpu_pct 的子集，三者可同时有值。任意计数回退或 Δtotal = 0 时三项一起缺失。
  optional double cpu_steal_pct = 23;
  optional double cpu_iowait_pct = 24;
}

// 主机静态信息。进程启动后的首次上报携带；此后仅在 hub 要求时携带。
message Facts {
  string hostname = 1;
  string os = 2;
  string kernel = 3;
  string arch = 4;
  string virtualization = 5;
  string cpu_model = 6;
  // agent 所在执行环境的有效核数：cgroup 有限额时取 cpuset 与 quota 较小者的上取整
  // （1.5 核报 2），否则是主机核数。旧 agent 一律报物理核数；该值只做展示与按核负载
  // 归一的分母，口径漂移可接受。
  uint32 cpu_cores = 7;
  string agent_version = 8;
  // 两种 ICMP socket 是否至少一种可用。
  bool icmp_available = 9;
  // agent 自报的双栈出口，仅用于管理展示；hub 不据此鉴权或查询国家。
  NetworkInfo network = 10;
  // 最近一次采集的白名单诊断，仅管理端可读；缺失表示 agent 尚未提供，不等于健康。
  // 不含原始错误、凭据、Hub URL 或完整命令行。沿 Facts 摘要对账，只在内容变化时落库。
  AgentDiagnostics diagnostics = 11;
}

message AgentDiagnostics {
  // 生效的包含/排除规则，包含非空时排除必须为空；排除已展开平台缺省值。
  // 每组至多 64 个 glob，每个至多 128 字节。
  repeated string net_include = 1;
  repeated string net_exclude = 2;
  // 最近成功采样实际计入的网卡，按名称排序，最多前 128 个，每个至多 64 字节。
  // 本次网络采集失败时为空，不回显上一次的集合冒充当前采集结果。
  repeated string net_interfaces = 3;
  // 实际计入的总数；大于 net_interfaces 长度表示展示列表被截断，计数和集合摘要仍覆盖全集。
  uint32 net_interfaces_total = 4;
  // 固定失败类别，不承载由文件内容或网络对端产生的原始错误文本；空列表表示本次采集无错误。
  repeated CollectionComponent failed_collectors = 5;
  // Agent 当前生效的上报间隔（毫秒），不含请求耗时和失败退避；0 表示尚未知。
  uint32 report_interval_ms = 6;
}

enum CollectionComponent {
  COLLECTION_COMPONENT_UNSPECIFIED = 0;
  COLLECTION_COMPONENT_BOOT_ID = 1;
  COLLECTION_COMPONENT_CPU = 2;
  COLLECTION_COMPONENT_MEMORY = 3;
  COLLECTION_COMPONENT_SWAP = 4;
  COLLECTION_COMPONENT_DISK = 5;
  COLLECTION_COMPONENT_LOAD = 6;
  COLLECTION_COMPONENT_PROCS = 7;
  COLLECTION_COMPONENT_UPTIME = 8;
  COLLECTION_COMPONENT_CONNS = 9;
  COLLECTION_COMPONENT_NET = 10;
  // 磁盘 I/O 计数器（/proc/diskstats）与磁盘用量（statfs）是两种来源，失败各自成类，
  // 面板才不会把"没有可计的整盘设备"显示成磁盘用量采集失败。
  COLLECTION_COMPONENT_DISK_IO = 11;
}

message NetworkInfo {
  AddressDetection ipv4 = 1;
  AddressDetection ipv6 = 2;
}

enum AddressDetectionState {
  ADDRESS_DETECTION_STATE_UNSPECIFIED = 0;
  ADDRESS_DETECTION_STATE_AVAILABLE = 1;
  ADDRESS_DETECTION_STATE_UNSUPPORTED = 2;
  ADDRESS_DETECTION_STATE_FAILED = 3;
}

message AddressDetection {
  AddressDetectionState state = 1;
  // 仅 AVAILABLE 有地址，且必须与所在字段的地址族相符。
  string address = 2;
  // 探测完成时间，Unix 秒；未探测为 0，已探测范围为 1..253402300799（9999 年末）。
  int64 checked_at = 3;
}

message ProbeResult {
  uint64 task_id = 1;
  // 测量完成至发送的时长，agent 单调钟；hub 用它反推测量时刻。
  uint32 age_ms = 2;
  oneof outcome {
    uint32 rtt_us = 3;
    // 计入丢包。
    Timeout timeout = 4;
    // 无权限、解析失败等；不计入丢包。
    ProbeError error = 5;
  }
}

message Timeout {}

message ProbeError {
  string message = 1;
}

enum ProbeKind {
  PROBE_KIND_UNSPECIFIED = 0;
  PROBE_KIND_ICMP = 1;
  PROBE_KIND_TCP = 2;
  PROBE_KIND_HTTP = 3;
  PROBE_KIND_DNS = 4;
}

message ProbeTask {
  uint64 id = 1;
  ProbeKind kind = 2;
  // 按种类：ICMP 是 IP 或主机名，TCP 是 host:port，HTTP 是绝对 URL，DNS 是要解析的 DNS 名。
  string target = 3;
  uint32 interval_s = 4;
  uint32 timeout_ms = 5;
  // DNS 任务要查询的解析器，ip:port 规范形式（IPv6 带方括号），只允许 IP 字面量：解析器自身
  // 若是名字就要先用别的解析器解析它，地址策略也就查不到实际要发包的地址。只对 DNS 任务有意义；
  // 其他种类携带即 InvalidArgument——静默忽略会让调用方以为它生效了。
  string dns_server = 6;
}

message ProbeTasks {
  uint64 version = 1;
  repeated ProbeTask tasks = 2;
}

message Traffic {
  // 自节点首次上报以来 hub 累计的字节数。校正只改周期用量，总量随同一差值变动。
  uint64 total_rx = 1;
  uint64 total_tx = 2;
  // 当前周期内的字节数。
  uint64 period_rx = 3;
  uint64 period_tx = 4;
  // 当前周期起点与下次重置时刻，Unix 秒。
  int64 period_start = 5;
  int64 next_reset_at = 6;
  // 周期重置日 1–28。
  uint32 reset_day = 7;
}

// 节点的计费周期（§9.4）。管理与公开两端共用，所以与 Billing 一起定义在这里：public.proto 不能 import admin.proto。
// 未指定表示没有周期（一次性付费或未填）；自动续期要求非未指定。
enum BillingCycle {
  BILLING_CYCLE_UNSPECIFIED = 0;
  // 1 个月。
  BILLING_CYCLE_MONTHLY = 1;
  // 3 个月。
  BILLING_CYCLE_QUARTERLY = 2;
  // 6 个月。
  BILLING_CYCLE_SEMIANNUAL = 3;
  // 12 个月。
  BILLING_CYCLE_YEARLY = 4;
  // 24 个月。
  BILLING_CYCLE_BIENNIAL = 5;
  // 36 个月。
  BILLING_CYCLE_TRIENNIAL = 6;
  // 60 个月。
  BILLING_CYCLE_QUINQUENNIAL = 7;
}

// 节点的计费与到期（§9.4）。价格与币种是提醒用的展示值：hub 不汇总、不换算，也不拿它们做任何计算；到期日与周期
// 驱动 days_left、自动续期与到期规则。Node、CreateNodeRequest 与 UpdateNodeRequest 都以它承载；公开端的 PublicBilling 由它按字段名投影生成，两者对不齐时 hub 构造公开服务就 panic。
message Billing {
  // 价格，十进制文本（如 12.50）；空表示未填。保存时须为空或匹配 ^[0-9]{1,9}(\.[0-9]{1,2})?$。
  string price = 1;
  // ISO 4217 币种代码（三个大写字母）；价格非空时必填，币种可以单独填。
  string currency = 2;
  BillingCycle billing_cycle = 3;
  // 到期日 YYYY-MM-DD；空表示没有到期日。保存时须为空或存在的日期。
  string expires_on = 4;
  // 开着时，到期日早于今天（hub 时区）即按周期推后到不早于今天。hub 启动、每个日界（零点不存在的日子取新一天的
  // 第一个时刻）、计费字段变化与保存启用的到期规则时检查。保存时要求 billing_cycle 与 expires_on 都非空。
  bool auto_renew = 5;
  // 到期日减去今天的天数，今天按 hub 的 --timezone 取日历日；负数是已过期的天数。没有到期日、或库里的到期日无法解析时缺失。只由 hub 填写：
  // 保存请求里的值忽略，与 AlertRule.created_at 同一做法。
  optional int32 days_left = 6;
}
