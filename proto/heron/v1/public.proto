syntax = "proto3";

package heron.v1;

option go_package = "github.com/xjetry/heron-probe/gen/heron/v1;heronv1";

import "heron/v1/cache.proto";
import "heron/v1/query.proto";
import "heron/v1/types.proto";

// 公开页与第三方主题 → hub。没有鉴权，不需要也不看任何凭据；按来源限流（IPv4 一个地址、IPv6 一个 /64 算一个来源）：
// 每个来源桶容量 60、每秒补充 10，超出返回 ResourceExhausted。只对标为公开的节点应答，未公开的节点与不存在的节点得到同一个 NotFound。
// 方法都无副作用，可用 GET 调用：/heron.v1.PublicService/<方法>?connect=v1&encoding=json&message=<URL 编码的 JSON 请求>。
// GET 的成功响应带 Cache-Control: max-age=<cache_max_age_s>，失败响应带 no-store；POST 响应不带缓存头。
// Settings.public_enabled 关闭时所有方法（包括 GetSite）返回 NotFound；快照字节缓存仍可在 1 秒内命中。
service PublicService {
  // 站点外观：标题、明暗、主色、logo 与自定义 CSS。
  rpc GetSite(GetSiteRequest) returns (PublicSite) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (heron.v1.cache_max_age_s) = 300;
  }
  // 全部公开节点的实时状态。请求是规范形态时（GET 的 message 为 JSON {} 或 proto 空消息，POST 的正文为 {} 或空，
  // 不带压缩与 Connect-Timeout-Ms；connect-web 与 curl 的写法都是），hub 按编码缓存响应字节 1 秒，窗口内不再序列化；
  // 其余形态每次序列化。节点改为非公开后，hub 最多再下发它 1 秒；GET 响应另带 max-age=1，浏览器与中间缓存还可再用 1 秒。
  rpc GetSnapshot(PublicServiceGetSnapshotRequest) returns (PublicSnapshot) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (heron.v1.cache_max_age_s) = 1;
  }
  // 公开节点一段时间的指标历史；请求与响应和 AdminService.QueryMetrics 相同。
  rpc QueryMetrics(QueryMetricsRequest) returns (QueryMetricsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (heron.v1.cache_max_age_s) = 60;
  }
  // 公开节点一段时间的探测历史。当前分配给该节点的任务，序列带种类与目标：把节点标为公开即公开它正在探测的目标。
  // 历史里有、但已从该节点撤下的任务不带这两项，客户端退回用 task_id 称呼。
  rpc QueryProbes(QueryProbesRequest) returns (QueryProbesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (heron.v1.cache_max_age_s) = 60;
  }
}

message GetSiteRequest {}

// 公开页外观，取值约束见 AdminService.UpdateSettings。空串表示该项用公开页的默认值。
message PublicSite {
  string title = 1;
  // auto、light 或 dark。
  string theme = 2;
  // #rrggbb 或空串。
  string accent_color = 3;
  // data:image/…;base64,… 或空串。
  string logo = 4;
  // 放在公开页内置样式之后的 CSS；不含 "</"。
  string custom_css = 5;
  // 应答这次请求的 origin 上管理面板的入口路径（/admin/），供公开页放登录入口；该 origin 上没有面板时为空串。
  // 主题 SDK 桥接不转交此字段，主题不能通过桥接调用管理服务。
  string admin_path = 6;
}

message PublicServiceGetSnapshotRequest {}

message PublicSnapshot {
  // hub 墙钟，Unix 秒；客户端据此显示"多久之前"而不依赖自己的时钟。
  int64 now = 1;
  // hub 下发给 agent 的上报间隔；实时状态不会比它更新得更快。
  uint32 report_interval_ms = 2;
  // 按 sort_order、id 升序。
  repeated PublicNode nodes = 3;
  // nodes 里各节点标签的并集，每个标签一次（Node.tags 的写法），按标签名的大小写折叠键排序，与管理端 ListTags 同序。
  // 公开页的标签栏照它渲染：顺序由 hub 的折叠键定，客户端不必复刻折叠规则。
  repeated string tags = 4;
}

message PublicNode {
  int64 id = 1;
  string name = 2;
  // 在线 ⇔ 距最近一次上报不足 TTL，hub 是唯一裁决者。
  bool online = 3;
  // 最近一次上报的墙钟 Unix 秒；从未上报则缺失。
  optional int64 last_seen_at = 4;
  // 管理员在面板里定的顺序；nodes 已按它排好。
  int32 sort_order = 5;
  // 主机静态信息的公开部分；从未上报则缺失。
  PublicFacts facts = 6;
  // 最近一次上报的读数；从未上报则缺失，离线节点仍带最后一次读数。
  PublicMetrics metrics = 7;
  // hub 侧累计的流量；每个节点都有，从未上报的节点为零用量。
  Traffic traffic = 8;
  // 计费与到期的公开部分（§9.4）；五项都没填时缺失。
  PublicBilling billing = 9;
  // 国家 / 地区（§4.9）的显示值，与 Node.country 相同，空串表示没有。只放行这个值：查得于哪个地址、来源是手动还是
  // 查得都不公开——公开页表达"在哪个区域"，不定位机器。
  string country = 10;
  // 节点标签，与 Node.tags 同一口径（先建的写法、按折叠排序）。只有公开节点进快照，私有节点的标签不出现；标签常写用途与
  // 归属（db、客户A），挂在公开节点上即对外可见，没有单独的公开开关。
  repeated string tags = 11;
  // 维护状态（§9.5），与 Node.maintenance 相同：公开页据此显示"维护中"徽章。
  bool maintenance = 12;
}

// Billing 的公开部分，字段号与 Billing 相同，由投影按字段名生成（与 PublicFacts 同一机制）。自动续期是运维开关，
// 不公开，号与名保留：要公开必须先删掉 reserved，而不是随手加一个字段。
message PublicBilling {
  reserved 5;
  reserved "auto_renew";
  // 价格，十进制文本（如 12.50）；空表示未填。
  string price = 1;
  // ISO 4217 币种代码；价格非空时必有。
  string currency = 2;
  BillingCycle billing_cycle = 3;
  // 到期日 YYYY-MM-DD；空表示没有到期日。
  string expires_on = 4;
  // 到期日减去今天的天数，今天按 hub 的 --timezone 取日历日；负数是已过期的天数。没有到期日、或库里的到期日无法解析时缺失。
  optional int32 days_left = 6;
}

// Facts 的公开部分，字段号与 Facts 相同。主机名、内核版本、agent 版本、ICMP 可用性、双栈出口与诊断不公开，
// 它们的号与名保留：要公开必须先删掉 reserved，而不是随手加一个字段。
message PublicFacts {
  reserved 1, 3, 8, 9, 10, 11;
  reserved "hostname", "kernel", "agent_version", "icmp_available", "network", "diagnostics";
  string os = 2;
  string arch = 4;
  string virtualization = 5;
  string cpu_model = 6;
  uint32 cpu_cores = 7;
}

// 与 Metrics 同字段号、同语义，但不公开启动标识与网卡集合标识。每个读数都是 optional：
// 缺失表示无读数，与读数为 0 是两个不同的事实。
message PublicMetrics {
  reserved 1, 20;
  reserved "boot_id", "net_counter_epoch";
  optional double cpu_pct = 2;
  optional double load1 = 3;
  optional double load5 = 4;
  optional double load15 = 5;
  optional uint64 mem_total = 6;
  optional uint64 mem_used = 7;
  optional uint64 swap_total = 8;
  optional uint64 swap_used = 9;
  optional uint64 disk_total = 10;
  optional uint64 disk_used = 11;
  // 内核累计计数器，字节。
  optional uint64 net_rx_total = 12;
  optional uint64 net_tx_total = 13;
  // agent 自测的瞬时速率，字节/秒。
  optional uint64 net_rx_bps = 14;
  optional uint64 net_tx_bps = 15;
  optional uint32 tcp_conns = 16;
  optional uint32 udp_conns = 17;
  optional uint32 procs = 18;
  optional uint64 uptime_s = 19;
  // 整盘设备读/写速率，字节/秒。
  optional uint64 disk_read_bps = 21;
  optional uint64 disk_write_bps = 22;
  // steal 与 iowait 占比，百分比。
  optional double cpu_steal_pct = 23;
  optional double cpu_iowait_pct = 24;
}
