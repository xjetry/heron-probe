name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 12
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: bufbuild/buf-action@8c6a16e16f12ba20b6470afa9c2ba9b5ba8c97c3 # v1
        with:
          setup_only: true
      - run: make ci
      # 与本地验收同一构建入口；版本注入与静态门禁都在 make release 里。
      - run: make release VERSION="$GITHUB_REF_NAME"
      # 去掉构建元数据（+ 及之后）后仍含 - 就是预发布，不能成为 releases/latest。
      - run: |
          extra=""
          case "${GITHUB_REF_NAME%%+*}" in
            *-*) extra=--prerelease ;;
          esac
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "$GITHUB_REF_NAME" $extra
        env:
          GH_TOKEN: ${{ github.token }}
