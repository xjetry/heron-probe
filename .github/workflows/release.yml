name: release
on:
  push:
    tags: ["v*"]
# 权限按 job 最小化：build 推镜像要 packages: write，publish 建 Release 要 contents: write，其余只读。
# 顶层为空集，新 job 不显式声明就没有任何权限。
permissions: {}
# latest 是共享指针：回读与移动 latest 都假设推送到回读之间没有别的写者，同组的运行串行。同组里已在排队的
# 运行会被后来者替换并取消，被取消的 tag 需要手工重跑。
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      # 不把 token 留在工作区的 .git/config：它带 packages: write，而 make ci、make release 会运行 pnpm 依赖、
      # Go 模块与 buf 等第三方代码。之后需要 token 的步骤各自经输入拿到（login-action 的 password、gh 的
      # GH_TOKEN；buf、setup-go、setup-node 的输入默认值也会拿到它），没有一步依赖工作区里的凭据。
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          # 只发 hub 的门禁要在本地检出绑定版本的 tag（git worktree add），浅克隆没有它。
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 12
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: bufbuild/buf-action@8c6a16e16f12ba20b6470afa9c2ba9b5ba8c97c3 # v1
        with:
          setup_only: true
      # lint 里的 buf breaking 要一个对照 ref。这里的检出是 detached 的 tag，没有本地分支（branch=main 在这里找不到），
      # 而发出去的 proto 要与已经发出去的兼容：对照上一个发布 tag，由 make release-breaking-base 判定。写进 GITHUB_ENV，
      # 之后每一步 make 都读到同一个值。
      - run: |
          base=$(make -s release-breaking-base VERSION="$GITHUB_REF_NAME")
          case "$base" in
            v*) ;;
            *) echo "make release-breaking-base printed '$base'" >&2; exit 1 ;;
          esac
          echo "BUF_AGAINST_REF=$base" >> "$GITHUB_ENV"
      - run: make ci
      # 发布种类只由 scripts/releasekind 判定（spec §14.1）：先取判定，再调用对应的发布目标；后续步骤读
      # 同一个输出。
      - id: kind
        run: |
          kind=$(make -s release-kind VERSION="$GITHUB_REF_NAME")
          case "$kind" in
            full|hub-only) ;;
            *) echo "make release-kind printed '$kind'" >&2; exit 1 ;;
          esac
          echo "kind=$kind" >> "$GITHUB_OUTPUT"
      # 与本地验收同一组发布目标；版本注入、版本号守卫、只发 hub 的门禁与静态门禁都在目标里。
      - run: make "release-$KIND" VERSION="$GITHUB_REF_NAME"
        env:
          KIND: ${{ steps.kind.outputs.kind }}
      # 回读要在 amd64 运行器上运行 arm64 镜像。构建本身不需要它：Dockerfile 唯一的 RUN 所在阶段固定在
      # --platform=$BUILDPLATFORM，最终阶段没有 RUN。binfmt 容器以特权运行，等同运行器上的 root，步骤顺序
      # 不提供隔离；它是否可信由 image 的 digest 固定与 action 的 SHA 固定承载。镜像不经 Actions 缓存。
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
        with:
          image: docker.io/tonistiigi/binfmt:qemu-v10.2.3@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
          platforms: arm64
          cache-image: false
      # 发布前用真实 hub 验证当前 agent。
      - run: make e2e
        env:
          E2E_LISTEN_HOST: 0.0.0.0
      # 发布前必须验证固定摘要的旧 agent，不能以当前源码构建替代兼容基线。
      - run: make compat-e2e
        env:
          E2E_LISTEN_HOST: 0.0.0.0
      # 只发 hub 时实际发出去的组合是 hub 加绑定版本已发布的 agent，用那份 agent 再跑一遍端到端。
      - if: steps.kind.outputs.kind == 'hub-only'
        run: make bound-agent-e2e
        env:
          E2E_LISTEN_HOST: 0.0.0.0
      # registry 由 Makefile 的 DOCKER_IMAGE 推出，登录与推送不会指向两个不同的 registry。
      - id: registry
        run: |
          host=$(make -s docker-registry)
          echo "host=$host" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ steps.registry.outputs.host }}
          username: ${{ github.actor }}
          password: ${{ github.token }}
      # 镜像在 build 里推送并回读，Release 在 publish 里最后创建；任一 job 失败都可以在 Actions 页面重跑
      # 失败的那个 job（同一 tag 重推镜像即覆盖）。推送只推版本 tag；latest 只在回读通过后按回读过的
      # digest 移动（make docker-promote）。
      - run: make docker-push VERSION="$GITHUB_REF_NAME"
      - run: make docker-readback VERSION="$GITHUB_REF_NAME"
      - run: make docker-promote VERSION="$GITHUB_REF_NAME"
      # dist 交给签名 job；签名 job 不重新构建，它签的就是这里通过 e2e 与镜像回读的那一份产物。
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7
  # 私钥只进这个 job：它不运行 make ci / make release 里的第三方代码，只编译标准库与 internal/releasesig
  # （scripts/releasesign 的依赖检查守着），也不恢复构建 job 写过的 Go 缓存——被污染的依赖可能在缓存里留下
  # 编译产物。私钥只经 env 交给签名那一步。
  sign:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist
      - name: sign
        env:
          HERON_RELEASE_SIGNING_KEY: ${{ secrets.HERON_RELEASE_SIGNING_KEY }}
        run: go run ./scripts/releasesign sign -version "$GITHUB_REF_NAME" -dir dist
      - run: go run ./scripts/releasesign verify -version "$GITHUB_REF_NAME" -dir dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signature
          path: dist/SHA256SUMS.sig
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: sign
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: signature
          path: dist
      # prerelease 与镜像是否移动 latest 读同一个判定（make release-channel）。
      - run: |
          channel=$(make -s release-channel VERSION="$GITHUB_REF_NAME")
          case "$channel" in
            prerelease) extra=--prerelease ;;
            stable) extra= ;;
            *) echo "make release-channel printed '$channel'" >&2; exit 1 ;;
          esac
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "$GITHUB_REF_NAME" ${extra:+"$extra"}
        env:
          GH_TOKEN: ${{ github.token }}
      # 回读：验的是 Release 页面上实际可下载的字节，不是本 job 手里的文件。
      - run: |
          gh release download "$GITHUB_REF_NAME" -p SHA256SUMS -p SHA256SUMS.sig -D readback
          go run ./scripts/releasesign verify -version "$GITHUB_REF_NAME" -dir readback
        env:
          GH_TOKEN: ${{ github.token }}
      # 只发 hub 的 release 原样带着绑定版本的两个 agent 安装脚本（spec §14.1）：从 Release 页面取回实际可
      # 下载的字节，核对它们等于绑定版本已验签清单里的摘要。
      - run: |
          kind=$(make -s release-kind VERSION="$GITHUB_REF_NAME")
          if [ "$kind" = hub-only ]; then
            bound=$(make -s agent-version)
            gh release download "$GITHUB_REF_NAME" -p install.sh -p install-macos.sh -D readback
            go run ./scripts/boundagent readback -version "$GITHUB_REF_NAME" -bound "$bound" -dir readback
          fi
        env:
          GH_TOKEN: ${{ github.token }}
