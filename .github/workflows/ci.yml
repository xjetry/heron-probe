name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 12
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: bufbuild/buf-action@8c6a16e16f12ba20b6470afa9c2ba9b5ba8c97c3 # v1
        with:
          setup_only: true
      - run: shellcheck --version
      - run: make ci
      - name: buf breaking
        if: github.event_name == 'pull_request'
        run: |
          main_files=$(git ls-tree -r --name-only origin/main)
          if grep -q '\.proto$' <<< "$main_files"; then
            buf breaking --against '.git#branch=origin/main'
          else
            echo "main has no .proto files yet; nothing to compare against"
          fi
  # darwin 的采集文件带 build tag，Linux 上的 go test 照不到（spec §12）；安装脚本的逻辑测试在这里
  # 跑的是 macOS 自带的 /bin/sh（bash 3.2 的 sh 模式），ubuntu 上跑的是 dash。
  # 两格覆盖 Apple Silicon 与 Intel：页大小（16 KiB 与 4 KiB）与 sysctl 的差异只在对应架构的 macOS 内核上显形。
  agent-macos:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-latest, macos-26-intel]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - run: go test -count=1 ./internal/agent/... ./cmd/agent/... ./deploy/...
        env:
          CGO_ENABLED: "0"
