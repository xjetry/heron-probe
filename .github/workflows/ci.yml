name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 12
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: bufbuild/buf-action@8c6a16e16f12ba20b6470afa9c2ba9b5ba8c97c3 # v1
        with:
          setup_only: true
      - run: shellcheck --version
      - run: make ci
      # 镜像的构建与冒烟（§12）：两个平台构建并核对根文件系统，本机平台装进 docker 后冒烟；不推送。
      - run: make docker VERSION=v0.0.0-ci
      - name: buf breaking
        if: github.event_name == 'pull_request'
        run: |
          main_files=$(git ls-tree -r --name-only origin/main)
          if grep -q '\.proto$' <<< "$main_files"; then
            buf breaking --against '.git#branch=origin/main'
          else
            echo "main has no .proto files yet; nothing to compare against"
          fi
